{% load i18n %}<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block subject %}Ambrosia{% endblock %}</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#112b39;">
<span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;">{% block preheader %}{% endblock %}</span>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f4f6;"><tr><td align="center" style="padding:28px 12px;">
<table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #dce3ed;border-radius:12px;overflow:hidden;">
<tr><td style="padding:26px 42px;border-bottom:1px solid #e3eaf2;"><span style="font-size:20px;font-weight:bold;letter-spacing:.14em;color:#376EB5;">AMBROSIA</span></td></tr>
<tr><td style="padding:30px 42px 10px 42px;">
<h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#112b39;">{% block heading %}{% endblock %}</h1>
<div style="font-size:15px;line-height:1.7;color:#334155;">{% block body %}{% endblock %}</div>
{% block cta %}{% endblock %}
{% block after %}{% endblock %}
</td></tr>
<tr><td style="padding:18px 42px 26px 42px;border-top:1px solid #e3eaf2;font-size:12px;line-height:1.6;color:#8591a3;">Ambrosia dashboard · Account access</td></tr>
</table></td></tr></table></body></html>
