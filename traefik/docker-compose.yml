services:
  traefik:
    image: traefik:v3.6.1
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./acme.json:/acme.json
      - /var/log/traefik:/var/log/traefik
    labels:
      - "traefik.enable=true"

      # Secure Traefik dashboard at https://traefik.dashboard.ambrosia-project.eu
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.dashboard.ambrosia-project.eu`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

      # Basic auth for the dashboard
      - "traefik.http.middlewares.traefik-dashboard-auth.basicauth.users=traefik_admin:$$2y$$05$$t7Eq5YSLDmLTQYPRQxCabuZJvhingsvR/gvzbTKyD9ckUspJzCIX2"

      # Light rate limiting: 10 req/s per source IP, bursts up to 20.
      # Traefik is the edge here, so this sees real client IPs.
      - "traefik.http.middlewares.traefik-dashboard-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.traefik-dashboard-ratelimit.ratelimit.burst=20"

      # Attach both middlewares to the dashboard router (comma-separated)
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth,traefik-dashboard-ratelimit"

    networks:
      - ambrosia_net
      - dev_ambrosia_net

networks:
  ambrosia_net:
    external: true
  dev_ambrosia_net:
    external: true