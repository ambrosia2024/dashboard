server {
    listen 80;

    server_name _;

    # Re-resolve the Django container on every request via Docker's internal DNS.
    # A literal proxy_pass hostname is resolved once at startup, so recreating the
    # container (new IP) left nginx answering 502 until it was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://ambrosia_dashboard:8000;

    # Ambra's chart Q&A is a token stream. Default proxy buffering holds the
    # whole answer until the upstream closes, which looks like a hung request.
    location ~ ^/api/risk-charts/.+/qa-stream/$ {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files with correct MIME types
    location /static/ {
        alias /app/staticfiles/;
        # Revalidate on every load (cheap 304s via ETag/Last-Modified) instead
        # of a 30-day hard cache. Without this, updated JS/CSS is not picked up
        # for 30 days, which makes deployed fixes look "not fixed" in the browser.
        add_header Cache-Control "no-cache";
        access_log off;
        autoindex on;
    }
}
